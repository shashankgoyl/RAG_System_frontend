[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* → Render backend (update the URL after deploying to Render)
[[redirects]]
  from   = "/api/*"
  to     = "https://conversation-rag-backend.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
