[build]
  base    = "RAG_System_frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* → Render backend (update the URL after deploying to Render)
[[redirects]]
  from   = "/api/*"
  to     = "https://rag-system-backend-vyn5.onrender.com"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
